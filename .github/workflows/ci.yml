name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow token can read the repository and nothing more.
permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # The API checks and the load tooling are scripts, outside the API's own tsconfig: a change to the API
      # that breaks them must fail here and not on the day somebody runs them.
      - name: Typecheck the evidence scripts
        run: npm run typecheck:scripts

      - name: Lint
        # Fails on any error, and on more warnings than the cap in package.json: lower the cap when you fix some.
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # NEXT_PUBLIC_* are inlined at build time; provide non-secret defaults
        # so the build doesn't try to bake real URLs into the artefact.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
          NEXT_PUBLIC_SAFEPAY_SANDBOX: "true"
        run: npm run build

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nuray
          POSTGRES_PASSWORD: nuray
          POSTGRES_DB: nuray_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuray"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nuray:nuray@localhost:5432/nuray_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-secret-key-at-least-32-characters-long
      API_VERSION: v1
      FRONTEND_URL: http://localhost:3000
      # NOTE: PORT is intentionally NOT set job-wide. The backend needs 3001
      # but `next dev` (started by Playwright's webServer) also honors PORT —
      # a job-wide PORT=3001 makes the frontend collide with the backend.
      # PORT is set only on the backend start step below.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-web/package-lock.json

      # ---- backend: install, migrate, seed, start ----
      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Prisma generate + migrate
        working-directory: backend
        # Builds the schema from an empty database with the migrations, exactly
        # as a production deploy does (prisma/migrations starts with a full baseline).
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Schema drift check
        working-directory: backend
        # Fails when schema.prisma was changed without a migration: the database
        # the migrations built must match the schema exactly.
        run: npm run db:check

      - name: Seed E2E data
        working-directory: backend
        run: npm run seed:e2e

      - name: Build + start backend
        working-directory: backend
        env:
          PORT: "3001"
          NODE_ENV: development
          # The E2E specs claim jobs from the open pool by hand; automatic assignment has its own checks.
          AUTO_ASSIGN_ENABLED: "false"
        run: |
          npm run build
          node dist/index.js &
          echo "Waiting for backend health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/health > /dev/null; then
              echo "Backend up"; break
            fi
            sleep 2
          done

      # ---- frontend: install, build, playwright (webServer boots `next start` on pre-built app) ----
      - name: Frontend install & build
        working-directory: frontend-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_SAFEPAY_SANDBOX: "true"
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        working-directory: frontend-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend-web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_SAFEPAY_SANDBOX: "true"
          # purchase.spec reads the email-verification token straight from the
          # DB via psql (no mailbox in CI). Point it at the CI database.
          E2E_DB_URL: postgresql://nuray:nuray@localhost:5432/nuray_test
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/rider-navigation.spec.ts tests/e2e/rider-location-resume.spec.ts tests/e2e/csp.spec.ts tests/e2e/geocode-proxy.spec.ts --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-web/playwright-report/
          retention-days: 7

      # The API checks talk to the backend started above (automatic rider assignment is off, so they claim
      # delivery jobs by hand) and use its database, where they make their own users, kitchens and orders.
      # After Playwright, so the data they leave behind cannot affect the browser specs.
      - name: API checks
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          API_URL: http://localhost:3001/api/v1
        run: npm run api-checks

  money-flows:
    name: Money flows (real database)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nuray
          POSTGRES_PASSWORD: nuray
          POSTGRES_DB: nuray_money
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuray"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://nuray:nuray@localhost:5432/nuray_money
      JWT_SECRET: ci-money-flows-secret-key-at-least-32-characters
      # Test mode: no SMS provider, no Redis, the payment gateway stubbed by the script itself.
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # Orders, promotions, refunds, payouts, ledgers, hubs, sessions and sign-in rules, called through the
      # services against the real schema. Exits 1 when a check fails and 2 when the script itself crashes.
      - name: Verify money flows
        run: npx ts-node scripts/verify-money-flows.ts

  load-tooling:
    # The launch load test is run by hand against staging, months after it is written. This keeps it from rotting
    # meanwhile: it seeds a small *_load database, starts the API on it and runs every scenario for a few seconds,
    # failing on errors only (a shared CI machine says nothing about speed).
    name: Load tooling (seed and a short run)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nuray
          POSTGRES_PASSWORD: nuray
          POSTGRES_DB: nuray_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuray"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://nuray:nuray@localhost:5432/nuray_load
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-load-secret-key-at-least-32-characters-long
      API_VERSION: v1
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:3001/api/v1
      LOAD_SCALE: "0.02"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed the load database (small)
        run: npm run load:seed

      - name: Build and start the API
        env:
          PORT: "3001"
          NODE_ENV: development
          # The sockets scenario needs every job to reach the open pool.
          AUTO_ASSIGN_ENABLED: "false"
        run: |
          npm run build
          node dist/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/health > /dev/null; then
              echo "API up"; break
            fi
            sleep 2
          done

      - name: Tokens, then every scenario for a few seconds
        run: |
          npm run load:tokens -- --customers 100 --riders 6 --kitchens 10 --rate 20
          npm run load:run -- browse --vus 5 --duration 8 --ramp 2 --smoke
          npm run load:run -- checkout --rate 30 --duration 10 --smoke
          npm run load:run -- rider-loop --vus 6 --duration 30 --ramp 3 --smoke
          npm run load:run -- login-storm --rate 5 --duration 5 --smoke
          npm run load:run -- sockets --sockets 100 --duration 15 --ramp 3 --jobs-per-minute 12 --smoke

  docker-build:
    # Sanity: confirm the Dockerfiles actually build on CI infra. No push here.
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: nuray-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Scan backend image (OS and library vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nuray-backend:ci
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-web
          push: false
          load: true
          tags: nuray-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
            NEXT_PUBLIC_SAFEPAY_SANDBOX=true

      - name: Scan frontend image (OS and library vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nuray-frontend:ci
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  security:
    # Known-vulnerable dependencies (production only) and committed secrets.
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Backend dependency audit
        working-directory: backend
        # The three remaining "high" advisories are in the Prisma CLI (build and migration time only,
        # not loaded by the running API) and need the Prisma 7 upgrade; critical ones fail the build.
        run: npm audit --omit=dev --audit-level=critical

      - name: Frontend dependency audit
        working-directory: frontend-web
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
