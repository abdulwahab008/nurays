name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # NEXT_PUBLIC_* are inlined at build time; provide non-secret defaults
        # so the build doesn't try to bake real URLs into the artefact.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
          NEXT_PUBLIC_SAFEPAY_SANDBOX: "true"
        run: npm run build

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nuray
          POSTGRES_PASSWORD: nuray
          POSTGRES_DB: nuray_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuray"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nuray:nuray@localhost:5432/nuray_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-secret-key-at-least-32-characters-long
      NODE_ENV: development
      PORT: "3001"
      API_VERSION: v1
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # ---- backend: install, migrate, seed, start ----
      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Prisma generate + migrate
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed E2E data
        working-directory: backend
        run: npm run seed:e2e

      - name: Build + start backend
        working-directory: backend
        run: |
          npm run build
          node dist/index.js &
          echo "Waiting for backend health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/health > /dev/null; then
              echo "Backend up"; break
            fi
            sleep 2
          done

      # ---- frontend: install, playwright (webServer boots `next dev`) ----
      - name: Frontend install
        working-directory: frontend-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_SAFEPAY_SANDBOX: "true"
          # purchase.spec reads the email-verification token straight from the
          # DB via psql (no mailbox in CI). Point it at the CI database.
          E2E_DB_URL: postgresql://nuray:nuray@localhost:5432/nuray_test
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-web/playwright-report/
          retention-days: 7

  docker-build:
    # Sanity: confirm the Dockerfiles actually build on CI infra. No push here.
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: nuray-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          push: false
          tags: nuray-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
            NEXT_PUBLIC_SAFEPAY_SANDBOX=true
