name: Publish Docker images

# Build + push to GitHub Container Registry on:
#   - every push to main           → tags `:main` + `:sha-<short>`
#   - every git tag matching v*    → tags `:<tag>` + `:latest`
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One publish at a time per branch/tag to avoid racing pushes to the same tag.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: nuray-backend
          - name: frontend
            context: ./frontend-web
            image: nuray-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The legal pages show a draft notice and bracketed placeholders until the company's details are set and
      # a lawyer has reviewed the texts. A release must not go out like that; main only warns.
      - name: Check the legal details of the frontend image
        if: matrix.name == 'frontend'
        env:
          REVIEWED: ${{ vars.NEXT_PUBLIC_LEGAL_REVIEWED }}
          COMPANY: ${{ vars.NEXT_PUBLIC_LEGAL_COMPANY_NAME }}
          ADDRESS: ${{ vars.NEXT_PUBLIC_LEGAL_ADDRESS }}
          EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
        run: |
          missing=""
          [ "$REVIEWED" = "true" ] || missing="$missing NEXT_PUBLIC_LEGAL_REVIEWED=true"
          [ -n "$COMPANY" ] || missing="$missing NEXT_PUBLIC_LEGAL_COMPANY_NAME"
          [ -n "$ADDRESS" ] || missing="$missing NEXT_PUBLIC_LEGAL_ADDRESS"
          [ -n "$EMAIL" ] || missing="$missing NEXT_PUBLIC_SUPPORT_EMAIL"
          if [ -z "$missing" ]; then
            echo "The legal details are set."
            exit 0
          fi
          message="The frontend image would carry draft legal pages. Set the repository variables:$missing."
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "::error title=Draft legal pages in a release::$message"
              exit 1
              ;;
            *)
              echo "::warning title=Draft legal pages::$message"
              ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # Frontend needs NEXT_PUBLIC_* at build time. Set these in repo
          # variables/secrets if the production values differ from sandbox.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_SAFEPAY_SANDBOX=${{ vars.NEXT_PUBLIC_SAFEPAY_SANDBOX || 'true' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || '' }}
            NEXT_PUBLIC_LEGAL_COMPANY_NAME=${{ vars.NEXT_PUBLIC_LEGAL_COMPANY_NAME || '' }}
            NEXT_PUBLIC_LEGAL_ADDRESS=${{ vars.NEXT_PUBLIC_LEGAL_ADDRESS || '' }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL || '' }}
            NEXT_PUBLIC_LEGAL_REVIEWED=${{ vars.NEXT_PUBLIC_LEGAL_REVIEWED || 'false' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || '' }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ vars.NEXT_PUBLIC_SENTRY_RELEASE || github.sha }}
            CSP_ENFORCE=${{ vars.CSP_ENFORCE || 'false' }}
            NEXT_PUBLIC_MAP_TILE_URL=${{ vars.NEXT_PUBLIC_MAP_TILE_URL || '' }}
            NEXT_PUBLIC_MAP_ATTRIBUTION=${{ vars.NEXT_PUBLIC_MAP_ATTRIBUTION || '' }}
