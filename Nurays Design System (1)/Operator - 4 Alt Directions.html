<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nurays Operator — 4 Alt Directions</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #ece9e1; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
<div id="app"></div>

<script type="text/babel" src="ui_kits/operator/alt-directions/ios-frame.jsx"></script>
<script type="text/babel" src="ui_kits/operator/alt-directions/design-canvas.jsx"></script>
<script type="text/babel" src="ui_kits/operator/alt-directions/themes.jsx"></script>
<script type="text/babel" src="ui_kits/operator/alt-directions/chrome.jsx"></script>
<script type="text/babel" src="ui_kits/operator/alt-directions/screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { THEMES, SCREENS, DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

const ORDER = ['neon', 'paper', 'thermal', 'bolt'];

const META = {
  neon:    { label: 'A · Neon Bazaar',    desc: 'Dark mode for the 4am kitchen. Acid lime + magenta on near-black. Mono numerics, glow edges, pure data-density energy.' },
  paper:   { label: 'B · Paper Market',   desc: 'Editorial. Cream paper, ink rules, tomato red, italic serif. Reads like a Sunday market broadsheet.' },
  thermal: { label: 'C · Thermal',        desc: 'Color = temperature. Frost blue → ember orange. Status bars literally show "heat" of activity. Deep navy ground.' },
  bolt:    { label: 'D · Bolt',           desc: 'A tool, not an app. Pure black ink on warm concrete, chartreuse + hazard tape. Anti-cute. Sharp.' },
};

function App() {
  return (
    <DesignCanvas>
      {/* Header postit */}
      <DCSection id="intro" title="Nurays Operator — 4 fresh directions" subtitle="14 screens × 4 design languages. None copy Foodpanda/Zomato/Swiggy/DoorDash.">
        {ORDER.map((key) => (
          <DCArtboard
            key={`hero-${key}`}
            id={`hero-${key}`}
            label={META[key].label}
            width={420}
            height={240}
          >
            <HeroCard themeKey={key} />
          </DCArtboard>
        ))}
      </DCSection>

      {/* One row per direction, with 14 screens in order */}
      {ORDER.map((key) => {
        const t = THEMES[key];
        return (
          <DCSection
            key={key}
            id={`row-${key}`}
            title={META[key].label}
            subtitle={META[key].desc}
          >
            {SCREENS.map(s => (
              <DCArtboard
                key={`${key}-${s.id}`}
                id={`${key}-${s.id}`}
                label={s.label}
                width={s.w}
                height={s.h}
              >
                <ThemedScreen themeKey={key} ScreenC={s.C} />
              </DCArtboard>
            ))}
          </DCSection>
        );
      })}
    </DesignCanvas>
  );
}

function ThemedScreen({ themeKey, ScreenC }) {
  const theme = THEMES[themeKey];
  // Render screen with its own theme provider — screens read theme from useT()
  // via Phone wrapper which expects a `theme` prop. We provide context here.
  return (
    <window.ThemeProvider theme={theme}>
      <ScreenC />
    </window.ThemeProvider>
  );
}

function HeroCard({ themeKey }) {
  const t = THEMES[themeKey];
  const m = t.motif;
  // Render hero in same visual language as the direction
  return (
    <div style={{
      width: '100%', height: '100%',
      background: t.bg, color: t.fg,
      fontFamily: t.fontBody,
      padding: 24,
      display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
      position: 'relative', overflow: 'hidden',
      border: m === 'rule' ? `1px solid ${t.fg}` : `1px solid ${t.border}`,
    }}>
      {m === 'glow' && <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(circle at 80% 30%, ${t.accent}33 0%, transparent 50%), radial-gradient(circle at 20% 80%, ${t.accent2}22 0%, transparent 60%)`, pointerEvents: 'none' }} />}
      {m === 'hatch' && <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 12, background: `repeating-linear-gradient(135deg, ${t.accent} 0 12px, ${t.fg} 12px 24px)` }} />}
      {m === 'thermal-bar' && <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, ${t.accent2}, ${t.accent3 || t.accent}, ${t.accent})` }} />}
      {m === 'rule' && <div style={{ position: 'absolute', top: 8, left: 16, right: 16, height: 1, background: t.fg }} />}

      <div style={{ position: 'relative' }}>
        <div style={{ fontSize: 10, letterSpacing: '0.2em', color: t.accent, fontWeight: 700, fontFamily: t.fontMono, textTransform: 'uppercase' }}>
          Direction {themeKey === 'neon' ? 'A' : themeKey === 'paper' ? 'B' : themeKey === 'thermal' ? 'C' : 'D'}
        </div>
        <div style={{
          fontFamily: t.fontDisp,
          fontSize: m === 'rule' ? 44 : 34,
          fontWeight: m === 'rule' ? 400 : 800,
          letterSpacing: '-0.03em',
          marginTop: 6, lineHeight: 1,
        }}>
          {m === 'rule' ? <em>{t.name}.</em> : t.name}
        </div>
        <div style={{ fontSize: 13, color: t.fgMuted, marginTop: 8, lineHeight: 1.4, maxWidth: 340 }}>
          {t.tagline}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 6, position: 'relative' }}>
        {[t.accent, t.accent2, t.accent3, t.success, t.warn, t.error].map((c, i) => (
          <div key={i} style={{ width: 28, height: 28, background: c, borderRadius: t.radius, border: m === 'rule' ? `1px solid ${t.fg}` : 'none' }} />
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 10, fontFamily: t.fontMono, color: t.fgMuted, letterSpacing: '0.1em', alignSelf: 'flex-end' }}>
          R{t.radius} · {t.fontDisp.split(',')[0].replace(/"/g, '')}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
