<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nurays Operator — Clean Direction</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #f4f3ef; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  input { font-family: inherit; }

  :root {
    --brand: #E63946;
    --brand-dark: #C92A36;
    --brand-soft: #FFE5E7;
    --ink: #0F1419;
    --ink-2: #2A323C;
    --gray-1: #F7F8FA;
    --gray-2: #EDEFF3;
    --gray-3: #D9DEE5;
    --gray-4: #99A2AD;
    --gray-5: #5C6573;
    --green: #00A36C;
    --green-soft: #DCF5EA;
    --orange: #FF8A1F;
    --orange-soft: #FFE9D2;
    --red-soft: #FDE7E9;
    --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.04), 0 2px 6px rgba(15, 20, 25, 0.04);
    --shadow-md: 0 2px 4px rgba(15, 20, 25, 0.04), 0 8px 20px rgba(15, 20, 25, 0.06);
    --shadow-lg: 0 4px 12px rgba(15, 20, 25, 0.06), 0 16px 40px rgba(15, 20, 25, 0.10);
  }

  /* Live pulse dot */
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 163, 108, 0.7); }
    50%      { box-shadow: 0 0 0 6px rgba(0, 163, 108, 0); }
  }
  .live-dot { animation: pulse-dot 1.8s infinite; }

  @keyframes pulse-dot-red {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
    50%      { box-shadow: 0 0 0 6px rgba(230, 57, 70, 0); }
  }
  .live-dot-red { animation: pulse-dot-red 1.8s infinite; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head>

<body>
<div id="app"></div>

// ============================================================
// PHONE WRAPPER (clean light theme)
// ============================================================
function Phone({ label, children, tab, fab }) {
  return (
    <div data-screen-label={label} style={{ position: 'relative' }}>
      <IOSDevice width={402} height={874} statusBarStyle="dark">
        <div style={{ ...cleanStyles.shell, paddingTop: 50, paddingBottom: tab ? 96 : 34, position: 'relative' }}>
          {children}
        </div>
        {tab && <TabBar active={tab} />}
        {fab && <FAB />}
      </IOSDevice>
    </div>
  );
}

function TabBar({ active }) {
  const tabs = [
    { id: 'home',  label: 'Home',    icon: I.home },
    { id: 'orders', label: 'Orders', icon: I.list, badge: 5 },
    { id: 'stock', label: 'Stock',   icon: I.cube },
    { id: 'reports', label: 'Stats', icon: I.chart },
    { id: 'more',  label: 'More',    icon: I.cog },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      paddingBottom: 30, paddingTop: 10, paddingInline: 4,
      background: '#fff',
      borderTop: '1px solid var(--gray-2)',
      display: 'flex', justifyContent: 'space-around',
      boxShadow: '0 -4px 20px rgba(15, 20, 25, 0.04)',
    }}>
      {tabs.map(tb => {
        const a = tb.id === active;
        return (
          <button key={tb.id} style={{
            flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
            color: a ? 'var(--brand)' : 'var(--gray-4)',
            padding: '4px 2px', position: 'relative',
          }}>
            <div style={{ position: 'relative' }}>
              {tb.icon}
              {tb.badge && <span style={{
                position: 'absolute', top: -4, right: -8,
                background: 'var(--brand)', color: '#fff',
                fontSize: 10, fontWeight: 800, lineHeight: 1,
                padding: '2px 5px', borderRadius: 10, minWidth: 16, textAlign: 'center',
                border: '2px solid #fff',
              }}>{tb.badge}</span>}
            </div>
            <span style={{ fontSize: 11, fontWeight: a ? 700 : 500 }}>{tb.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function FAB() {
  return (
    <button style={{
      position: 'absolute', right: 18, bottom: 110, zIndex: 4,
      width: 58, height: 58, borderRadius: 20,
      background: 'var(--brand)', color: '#fff',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: '0 6px 20px rgba(230, 57, 70, 0.45), 0 2px 6px rgba(230, 57, 70, 0.3)',
    }}>
      {I.plus}
    </button>
  );
}

// ============================================================
// 02 — DASHBOARD
// ============================================================

            <span className="live-dot" style={{ width: 6, height: 6, borderRadius: 3, background: 'var(--green)', display: 'inline-block' }} /> Live

          Active orders

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <ActiveOrder name="John Smith" img={IMG.john} id="ORD-001" status="Preparing" eta="14:00" total="₹1,349" items={2} progress={50} />

function StatCard({ icon, label, value, delta, tone = 'green' }) {
  const tones = {
    green:  { bg: 'var(--green-soft)',  fg: 'var(--green)' },
    orange: { bg: 'var(--orange-soft)', fg: 'var(--orange)' },
    red:    { bg: 'var(--red-soft)',    fg: 'var(--brand)' },
  };
  const c = tones[tone];
  return (
    <div style={{ background: '#fff', border: '1px solid var(--gray-2)', borderRadius: 18, padding: 12, boxShadow: 'var(--shadow-sm)' }}>
      <div style={{ width: 32, height: 32, borderRadius: 10, background: c.bg, color: c.fg, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 8 }}>
        {icon}
      </div>
      <div style={{ fontSize: 11, color: 'var(--gray-5)', fontWeight: 500 }}>{label}</div>
      <div style={{ fontSize: 20, fontWeight: 800, fontFamily: 'Plus Jakarta Sans, Inter, sans-serif', letterSpacing: '-0.02em', color: 'var(--ink)', marginTop: 2, lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: 11, color: c.fg, fontWeight: 700, marginTop: 4, display: 'inline-flex', alignItems: 'center', gap: 2 }}>
        {tone === 'orange' ? I.up : I.up} {delta}
      </div>
    </div>
  );
}

function SectionTitle({ children, action, rightChip }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ fontSize: 17, fontWeight: 800, fontFamily: 'Plus Jakarta Sans, Inter, sans-serif', letterSpacing: '-0.01em', color: 'var(--ink)' }}>{children}</div>

      </div>
