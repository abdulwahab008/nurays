<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; line-height: 1; }
  .b-success { background: var(--success-50); color: var(--success-700); border: 1px solid var(--primary-200); }
  .b-warn    { background: var(--warning-50); color: var(--warning-700); border: 1px solid #fde68a; }
  .b-error   { background: var(--error-50);  color: var(--error-700);   border: 1px solid #fecaca; }
  .b-info    { background: var(--info-50);   color: var(--info-700);    border: 1px solid var(--accent-200); }
  .b-neutral { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200); }
  .b-orange  { background: var(--secondary-50); color: var(--secondary-700); border: 1px solid var(--secondary-200); }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
</style></head>
<body>
  <span class="badge b-success"><span class="dot" style="background: var(--success-500);"></span>In Stock</span>
  <span class="badge b-warn"><span class="dot" style="background: var(--warning-500);"></span>Low Stock</span>
  <span class="badge b-error"><span class="dot" style="background: var(--error-500);"></span>Out of Stock</span>
  <span class="badge b-info">Featured</span>
  <span class="badge b-success">Organic</span>
  <span class="badge b-orange">Bestseller</span>
  <span class="badge b-neutral">Draft</span>
  <span class="badge b-info">New</span>
</body></html>
