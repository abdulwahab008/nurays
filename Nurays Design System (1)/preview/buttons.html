<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 24px; border: none; border-radius: var(--radius-lg); font-family: var(--font-sans); font-size: 16px; font-weight: 500; cursor: pointer; transition: all 150ms ease; }
  .btn-primary { background: var(--gradient-primary); color: white; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .btn-secondary { background: white; color: var(--fg-primary); border: 1px solid var(--border-medium); box-shadow: var(--shadow-sm); }
  .btn-accent { background: var(--gradient-accent); color: white; box-shadow: var(--shadow-sm); }
  .btn-ghost { background: transparent; color: var(--fg-secondary); }
  .btn-ghost:hover { background: var(--bg-tertiary); color: var(--fg-primary); }
  .btn-danger { background: var(--error-500); color: white; box-shadow: var(--shadow-sm); }
  .btn-disabled { background: var(--gradient-primary); color: white; opacity: 0.5; cursor: not-allowed; }
</style></head>
<body>
  <button class="btn btn-primary">Add Product</button>
  <button class="btn btn-secondary">Cancel</button>
  <button class="btn btn-accent">View Reports</button>
  <button class="btn btn-ghost">Skip</button>
  <button class="btn btn-danger">Delete</button>
  <button class="btn btn-disabled">Disabled</button>
</body></html>
