<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 20px; }
  .row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 0; height: 96px; border-radius: var(--radius-lg); display: flex; align-items: flex-end; padding: 10px; color: white; font-size: 11px; font-weight: 600; box-shadow: var(--shadow-xs); }
  .swatch .hex { opacity: 0.85; font-family: var(--font-mono); font-weight: 500; font-size: 10px; }
  .stack { display: flex; flex-direction: column; gap: 2px; }
  .dark-text { color: var(--gray-900); }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background: var(--accent-50);"><span class="stack dark-text"><span>50</span><span class="hex">#eff6ff</span></span></div>
    <div class="swatch" style="background: var(--accent-100);"><span class="stack dark-text"><span>100</span><span class="hex">#dbeafe</span></span></div>
    <div class="swatch" style="background: var(--accent-200);"><span class="stack dark-text"><span>200</span><span class="hex">#bfdbfe</span></span></div>
    <div class="swatch" style="background: var(--accent-300);"><span class="stack dark-text"><span>300</span><span class="hex">#93c5fd</span></span></div>
    <div class="swatch" style="background: var(--accent-400);"><span class="stack"><span>400</span><span class="hex">#60a5fa</span></span></div>
    <div class="swatch" style="background: var(--accent-500); outline: 2px solid var(--accent-700); outline-offset: -2px;"><span class="stack"><span>500 ★</span><span class="hex">#3b82f6</span></span></div>
    <div class="swatch" style="background: var(--accent-600);"><span class="stack"><span>600</span><span class="hex">#2563eb</span></span></div>
    <div class="swatch" style="background: var(--accent-700);"><span class="stack"><span>700</span><span class="hex">#1d4ed8</span></span></div>
    <div class="swatch" style="background: var(--accent-800);"><span class="stack"><span>800</span><span class="hex">#1e40af</span></span></div>
    <div class="swatch" style="background: var(--accent-900);"><span class="stack"><span>900</span><span class="hex">#1e3a8a</span></span></div>
  </div>
</body></html>
