<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 20px; }
  .row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 0; height: 96px; border-radius: var(--radius-lg); display: flex; align-items: flex-end; padding: 10px; color: white; font-family: var(--font-sans); font-size: 11px; font-weight: 600; box-shadow: var(--shadow-xs); }
  .swatch .hex { opacity: 0.85; font-family: var(--font-mono); font-weight: 500; font-size: 10px; }
  .swatch .label { display: block; }
  .stack { display: flex; flex-direction: column; gap: 2px; }
  .dark-text { color: var(--gray-900); }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background: var(--primary-50);"><span class="stack dark-text"><span class="label">50</span><span class="hex">#f0fdf4</span></span></div>
    <div class="swatch" style="background: var(--primary-100);"><span class="stack dark-text"><span class="label">100</span><span class="hex">#dcfce7</span></span></div>
    <div class="swatch" style="background: var(--primary-200);"><span class="stack dark-text"><span class="label">200</span><span class="hex">#bbf7d0</span></span></div>
    <div class="swatch" style="background: var(--primary-300);"><span class="stack dark-text"><span class="label">300</span><span class="hex">#86efac</span></span></div>
    <div class="swatch" style="background: var(--primary-400);"><span class="stack"><span class="label">400</span><span class="hex">#4ade80</span></span></div>
    <div class="swatch" style="background: var(--primary-500); outline: 2px solid var(--primary-700); outline-offset: -2px;"><span class="stack"><span class="label">500 ★</span><span class="hex">#22c55e</span></span></div>
    <div class="swatch" style="background: var(--primary-600);"><span class="stack"><span class="label">600</span><span class="hex">#16a34a</span></span></div>
    <div class="swatch" style="background: var(--primary-700);"><span class="stack"><span class="label">700</span><span class="hex">#15803d</span></span></div>
    <div class="swatch" style="background: var(--primary-800);"><span class="stack"><span class="label">800</span><span class="hex">#166534</span></span></div>
    <div class="swatch" style="background: var(--primary-900);"><span class="stack"><span class="label">900</span><span class="hex">#14532d</span></span></div>
  </div>
</body></html>
