<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 20px; }
  .row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 0; height: 96px; border-radius: var(--radius-lg); display: flex; align-items: flex-end; padding: 10px; color: white; font-size: 11px; font-weight: 600; box-shadow: var(--shadow-xs); }
  .swatch .hex { opacity: 0.85; font-family: var(--font-mono); font-weight: 500; font-size: 10px; }
  .stack { display: flex; flex-direction: column; gap: 2px; }
  .dark-text { color: var(--gray-900); }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background: var(--secondary-50);"><span class="stack dark-text"><span>50</span><span class="hex">#fff7ed</span></span></div>
    <div class="swatch" style="background: var(--secondary-100);"><span class="stack dark-text"><span>100</span><span class="hex">#ffedd5</span></span></div>
    <div class="swatch" style="background: var(--secondary-200);"><span class="stack dark-text"><span>200</span><span class="hex">#fed7aa</span></span></div>
    <div class="swatch" style="background: var(--secondary-300);"><span class="stack dark-text"><span>300</span><span class="hex">#fdba74</span></span></div>
    <div class="swatch" style="background: var(--secondary-400);"><span class="stack"><span>400</span><span class="hex">#fb923c</span></span></div>
    <div class="swatch" style="background: var(--secondary-500); outline: 2px solid var(--secondary-700); outline-offset: -2px;"><span class="stack"><span>500 ★</span><span class="hex">#f97316</span></span></div>
    <div class="swatch" style="background: var(--secondary-600);"><span class="stack"><span>600</span><span class="hex">#ea580c</span></span></div>
    <div class="swatch" style="background: var(--secondary-700);"><span class="stack"><span>700</span><span class="hex">#c2410c</span></span></div>
    <div class="swatch" style="background: var(--secondary-800);"><span class="stack"><span>800</span><span class="hex">#9a3412</span></span></div>
    <div class="swatch" style="background: var(--secondary-900);"><span class="stack"><span>900</span><span class="hex">#7c2d12</span></span></div>
  </div>
</body></html>
