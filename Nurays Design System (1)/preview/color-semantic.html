<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius-lg); border: 1px solid var(--border-light); background: var(--bg-primary); }
  .dot { width: 36px; height: 36px; border-radius: var(--radius-md); flex-shrink: 0; box-shadow: var(--shadow-xs); }
  .label { font-size: 13px; font-weight: 600; color: var(--fg-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-secondary); }
  .lbl-stack { display: flex; flex-direction: column; gap: 2px; }
</style></head>
<body>
  <div class="grid">
    <div class="item"><div class="dot" style="background: var(--success-500);"></div><div class="lbl-stack"><span class="label">Success</span><span class="hex">#22c55e</span></div></div>
    <div class="item"><div class="dot" style="background: var(--warning-500);"></div><div class="lbl-stack"><span class="label">Warning</span><span class="hex">#f59e0b</span></div></div>
    <div class="item"><div class="dot" style="background: var(--error-500);"></div><div class="lbl-stack"><span class="label">Error</span><span class="hex">#ef4444</span></div></div>
    <div class="item"><div class="dot" style="background: var(--info-500);"></div><div class="lbl-stack"><span class="label">Info</span><span class="hex">#3b82f6</span></div></div>
  </div>
</body></html>
