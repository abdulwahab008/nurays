<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 14px; font-weight: 500; color: var(--fg-primary); }
  .input { min-height: 44px; padding: 12px 16px; border: 1px solid var(--border-medium); border-radius: var(--radius-lg); font-family: var(--font-sans); font-size: 16px; color: var(--fg-primary); background: white; outline: none; }
  .input:focus { border-color: var(--primary-500); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
  .input.error { border-color: var(--error-500); }
  .err { font-size: 13px; color: var(--error-600); display: flex; gap: 6px; align-items: center; }
  .help { font-size: 13px; color: var(--fg-secondary); }
  .focused { border-color: var(--primary-500); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
</style></head>
<body>
  <div class="field">
    <label class="label">Email Address</label>
    <input class="input" placeholder="you@nurays.app" value="priya@kitchenco.in">
    <span class="help">We'll never share your email.</span>
  </div>
  <div class="field">
    <label class="label">Password</label>
    <input class="input focused" type="password" value="••••••••••" placeholder="Enter your password">
    <span class="help" style="color: var(--primary-700);">Focused state</span>
  </div>
  <div class="field">
    <label class="label">Product SKU</label>
    <input class="input error" value="ORG-CAR" placeholder="Enter SKU">
    <span class="err">⚠ SKU must be at least 8 characters</span>
  </div>
  <div class="field">
    <label class="label">Default Unit</label>
    <select class="input"><option>kg</option><option>g</option><option>pieces</option></select>
  </div>
</body></html>
