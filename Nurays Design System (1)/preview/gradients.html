<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .grad { height: 80px; border-radius: var(--radius-xl); display: flex; align-items: center; padding: 0 18px; color: white; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-sm); }
  .name { flex: 1; }
  .var { font-family: var(--font-mono); font-size: 11px; opacity: 0.9; }
</style></head>
<body>
  <div class="grad" style="background: var(--gradient-primary);"><span class="name">Primary</span><span class="var">--gradient-primary</span></div>
  <div class="grad" style="background: var(--gradient-secondary);"><span class="name">Secondary</span><span class="var">--gradient-secondary</span></div>
  <div class="grad" style="background: var(--gradient-accent);"><span class="name">Accent</span><span class="var">--gradient-accent</span></div>
  <div class="grad" style="background: var(--gradient-hero);"><span class="name">Hero (signature)</span><span class="var">--gradient-hero</span></div>
</body></html>
