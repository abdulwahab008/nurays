<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; display: flex; align-items: center; gap: 36px; }
  .mark { width: 80px; height: 80px; border-radius: var(--radius-2xl); background: #4F46E5; display: flex; align-items: center; justify-content: center; font-size: 44px; box-shadow: var(--shadow-md); }
  .text-mark { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .lbl { font-size: 11px; color: var(--fg-tertiary); font-family: var(--font-mono); }
  .note { font-size: 12px; color: var(--fg-secondary); max-width: 280px; }
</style></head>
<body>
  <div class="stack"><div class="mark">🍽️</div><span class="lbl">app icon</span></div>
  <div class="stack"><span class="text-mark">Nurays</span><span class="lbl">wordmark</span></div>
  <span class="note">⚠ Placeholder. Codebase ships an emoji-on-square icon. Real wordmark + monogram pending.</span>
</body></html>
