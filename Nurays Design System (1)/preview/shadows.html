<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--gray-50); }
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; align-items: center; justify-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 60px; height: 60px; background: white; border-radius: var(--radius-lg); }
  .val { font-size: 12px; font-weight: 600; color: var(--fg-primary); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); }
</style></head>
<body>
  <div class="grid">
    <div class="col"><div class="box" style="box-shadow: var(--shadow-xs);"></div><span class="val">xs</span></div>
    <div class="col"><div class="box" style="box-shadow: var(--shadow-sm);"></div><span class="val">sm</span></div>
    <div class="col"><div class="box" style="box-shadow: var(--shadow-md);"></div><span class="val">md</span></div>
    <div class="col"><div class="box" style="box-shadow: var(--shadow-lg);"></div><span class="val">lg</span></div>
    <div class="col"><div class="box" style="box-shadow: var(--shadow-xl);"></div><span class="val">xl</span></div>
    <div class="col"><div class="box" style="box-shadow: var(--shadow-2xl);"></div><span class="val">2xl</span></div>
  </div>
</body></html>
