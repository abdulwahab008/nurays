<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--gray-50); }
  body { padding: 0; }
  .nav { width: 280px; background: white; border-right: 1px solid var(--border-light); padding: 16px; min-height: 320px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 12px 4px 16px; border-bottom: 1px solid var(--border-light); margin-bottom: 12px; }
  .brand-icon { font-size: 24px; }
  .brand-text { font-size: 18px; font-weight: 700; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-lg); color: var(--fg-secondary); font-weight: 500; font-size: 14px; cursor: pointer; position: relative; margin-bottom: 4px; }
  .item:hover { background: var(--bg-tertiary); color: var(--fg-primary); }
  .item.active { background: var(--primary-50); color: var(--primary-700); }
  .item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--primary-500); border-radius: 9999px; }
  .item-icon { width: 18px; height: 18px; border-radius: 4px; background: currentColor; opacity: 0.4; flex-shrink: 0; }
  .item.active .item-icon { opacity: 1; }
</style></head>
<body>
  <nav class="nav">
    <div class="brand"><span class="brand-icon">🍽️</span><span class="brand-text">Nurays</span></div>
    <div class="item active"><span class="item-icon"></span>Dashboard</div>
    <div class="item"><span class="item-icon"></span>Products</div>
    <div class="item"><span class="item-icon"></span>Vendors</div>
    <div class="item"><span class="item-icon"></span>Orders</div>
  </nav>
</body></html>
