<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; align-items: end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { background: var(--primary-100); border: 1px solid var(--primary-300); border-radius: var(--radius-sm); width: 100%; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); }
  .val { font-size: 12px; font-weight: 600; color: var(--fg-primary); }
</style></head>
<body>
  <div class="grid">
    <div class="col"><div class="box" style="height: 4px;"></div><span class="val">1</span><span class="lbl">4px</span></div>
    <div class="col"><div class="box" style="height: 8px;"></div><span class="val">2</span><span class="lbl">8px</span></div>
    <div class="col"><div class="box" style="height: 16px;"></div><span class="val">4</span><span class="lbl">16px</span></div>
    <div class="col"><div class="box" style="height: 24px;"></div><span class="val">6</span><span class="lbl">24px</span></div>
    <div class="col"><div class="box" style="height: 32px;"></div><span class="val">8</span><span class="lbl">32px</span></div>
    <div class="col"><div class="box" style="height: 48px;"></div><span class="val">12</span><span class="lbl">48px</span></div>
  </div>
</body></html>
