<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--gray-50); }
  body { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: white; border: 1px solid var(--border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 14px 16px; display: flex; gap: 12px; align-items: center; min-height: 48px; }
  .toast.success { border-left: 4px solid var(--success-500); }
  .toast.error   { border-left: 4px solid var(--error-500); }
  .toast.warning { border-left: 4px solid var(--warning-500); }
  .toast.info    { border-left: 4px solid var(--info-500); }
  .ic { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; flex-shrink: 0; font-size: 14px; }
  .msg { flex: 1; font-size: 14px; color: var(--fg-primary); font-weight: 500; }
  .time { font-size: 12px; color: var(--fg-tertiary); }
</style></head>
<body>
  <div class="toast success"><div class="ic" style="background: var(--success-500);">✓</div><span class="msg">Order #ORD-001 created successfully</span><span class="time">just now</span></div>
  <div class="toast warning"><div class="ic" style="background: var(--warning-500);">!</div><span class="msg">Low stock: Tomatoes (5kg remaining)</span><span class="time">2m</span></div>
  <div class="toast error"><div class="ic" style="background: var(--error-500);">✕</div><span class="msg">Payment failed — please retry</span><span class="time">5m</span></div>
  <div class="toast info"><div class="ic" style="background: var(--info-500);">i</div><span class="msg">New vendor "Fresh Farms" awaiting approval</span><span class="time">1h</span></div>
</body></html>
