<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { width: 110px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); flex-shrink: 0; }
</style></head>
<body>
  <div class="row"><span class="meta">lead / 18</span><p class="lead">A weekly digest of orders, vendors, and inventory you actually need to act on.</p></div>
  <div class="row"><span class="meta">body / 16</span><p>Today's revenue is up 8%. Three vendors need follow-up and one product is low stock.</p></div>
  <div class="row"><span class="meta">caption / 14</span><span class="caption">Last synced 2 minutes ago</span></div>
  <div class="row"><span class="meta">eyebrow / 12</span><span class="eyebrow">Today's Activity</span></div>
  <div class="row"><span class="meta">code / mono</span><span class="code">ORD-001</span></div>
</body></html>
