<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px dashed var(--border-light); }
  .row:last-child { border-bottom: 0; }
  .meta { width: 100px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); flex-shrink: 0; }
  .sample { color: var(--fg-primary); }
</style></head>
<body>
  <div class="row"><span class="meta">h1 / 36 / 800</span><span class="sample h1">The quick fox</span></div>
  <div class="row"><span class="meta">h2 / 30 / 700</span><span class="sample h2">The quick brown fox</span></div>
  <div class="row"><span class="meta">h3 / 24 / 600</span><span class="sample h3">The quick brown fox jumps</span></div>
  <div class="row"><span class="meta">h4 / 20 / 600</span><span class="sample h4">The quick brown fox jumps over</span></div>
  <div class="row"><span class="meta">h5 / 18 / 600</span><span class="sample h5">The quick brown fox jumps over the lazy</span></div>
</body></html>
