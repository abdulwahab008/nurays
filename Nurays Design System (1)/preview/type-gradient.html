<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-primary); }
  body { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; }
  .gradient-text { background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .caption { color: var(--fg-secondary); }
</style></head>
<body>
  <h1 class="gradient-text">Welcome back, Priya.</h1>
  <span class="caption">Display headings receive the signature primary→accent gradient text treatment. Use sparingly — page titles and login only.</span>
</body></html>
