<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nurays — Operator Desktop Screens</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="icon" href="../../../assets/favicon.ico">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #f0eee9; font-family: var(--font-sans); }
  *[data-screen-label] { display: contents; }
  .gradient-text { background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="../screens/shared.jsx"></script>
<script type="text/babel" src="../screens/screens-1.jsx"></script>
<script type="text/babel" src="desktop-screens.jsx"></script>

<script type="text/babel">
  const W = 1280, H = 820;

  function Wrap({ url, tabs, active, children }) {
    return (
      <ChromeWindow width={W} height={H} url={url}
        tabs={tabs || [{ title: 'Nurays Operator' }, { title: 'Inventory · Nurays' }, { title: 'Reports · Analytics' }]}
        activeIndex={active ?? 0}>
        {children}
      </ChromeWindow>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="auth" title="Auth" subtitle="Sign-in & onboarding">
          <DCArtboard id="login" label="01 · Login" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/login" tabs={[{ title: 'Sign in · Nurays' }]} active={0}>
              <LoginDesktop />
            </Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="overview" title="Dashboard" subtitle="Operator command center">
          <DCArtboard id="dashboard" label="02 · Dashboard" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/dashboard" active={0}>
              <DashboardDesktop />
            </Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="ops" title="Operations" subtitle="Order & inventory workflows">
          <DCArtboard id="orders" label="03 · Orders" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/orders" active={0}>
              <OrdersDesktop />
            </Wrap>
          </DCArtboard>
          <DCArtboard id="inventory" label="04 · Inventory" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/inventory" active={1}>
              <InventoryDesktop />
            </Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="catalog" title="Catalog & Vendors" subtitle="Products and suppliers">
          <DCArtboard id="products" label="05 · Products" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/products" active={0}>
              <ProductsDesktop />
            </Wrap>
          </DCArtboard>
          <DCArtboard id="vendors" label="06 · Vendors" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/vendors" active={0}>
              <VendorsDesktop />
            </Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="insights" title="Insights" subtitle="Performance analytics">
          <DCArtboard id="reports" label="07 · Reports" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/reports" active={2}>
              <ReportsDesktop />
            </Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="account" title="Account" subtitle="Business profile & preferences">
          <DCArtboard id="settings" label="08 · Settings" width={W} height={H}>
            <Wrap url="https://operator.nurays.in/settings" active={0}>
              <SettingsDesktop />
            </Wrap>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
