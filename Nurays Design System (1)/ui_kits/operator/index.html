<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nurays — Operator UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="icon" href="../../assets/favicon.ico">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg-secondary); }
  .layout { display: flex; min-height: 100vh; }
  .main { margin-left: 280px; flex: 1; min-height: 100vh; }
  .content { padding: 24px 32px 64px; max-width: 1280px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
  .qa-section { margin-bottom: 24px; }
  .section-title { font-size: 14px; font-weight: 600; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px; }
  *[data-screen-label] { display: contents; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="PageHeading.jsx"></script>
  <script type="text/babel" src="ActivityFeed.jsx"></script>
  <script type="text/babel" src="Login.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const QUICK_STATS = [
      { title: "Today's Orders",  value: 24,        change: '+12%', changeType: 'increase', icon: '📦', color: 'var(--accent-500)',    barGradient: 'var(--gradient-primary)' },
      { title: "Today's Revenue", value: '₹12,450', change: '+8%',  changeType: 'increase', icon: '₹',  color: 'var(--primary-500)',  barGradient: 'var(--gradient-accent)' },
      { title: "Total Products",  value: 156,       change: '+3',   changeType: 'increase', icon: '◫',  color: 'var(--secondary-500)', barGradient: 'var(--gradient-primary)' },
      { title: "Low Stock Items", value: 8,         change: '-2',   changeType: 'decrease', icon: '⚠',  color: 'var(--error-500)',    barGradient: 'var(--gradient-secondary)' },
      { title: "Total Customers", value: 89,        change: '+5',   changeType: 'increase', icon: '◉',  color: 'var(--info-500)',     barGradient: 'var(--gradient-primary)' },
      { title: "Pending Orders",  value: 5,         change: '-1',   changeType: 'decrease', icon: '◷',  color: 'var(--secondary-500)', barGradient: 'var(--gradient-accent)' },
    ];

    const ACTIVITY = [
      { id: 1, status: 'success', message: 'New order #ORD-001 received from John Doe',     time: '2 minutes ago' },
      { id: 2, status: 'warning', message: 'Low stock alert: Tomatoes (5kg remaining)',     time: '15 minutes ago' },
      { id: 3, status: 'success', message: 'Order #ORD-002 delivered successfully',         time: '1 hour ago' },
      { id: 4, status: 'info',    message: 'New product "Organic Carrots" added',           time: '2 hours ago' },
      { id: 5, status: 'success', message: 'Payment processed for Fresh Farms Ltd',         time: '3 hours ago' },
    ];

    function QuickActionsLocal({ actions }) {
      return (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
          {actions.map((a) => (
            <a key={a.title} href="#" onClick={(e) => { e.preventDefault(); a.onClick?.(); }}
               style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, padding: '20px 16px',
                        background: 'white', border: '1px solid var(--border-light)', borderRadius: 12,
                        boxShadow: 'var(--shadow-sm)', textDecoration: 'none', color: 'var(--fg-primary)' }}>
              <div style={{ width: 44, height: 44, borderRadius: 10, display: 'flex', alignItems: 'center',
                            justifyContent: 'center', color: 'white', fontSize: 20, fontWeight: 700, background: a.bg }}>{a.icon}</div>
              <span style={{ fontSize: 14, fontWeight: 600 }}>{a.title}</span>
            </a>
          ))}
        </div>
      );
    }

    function Dashboard({ active, onNavigate, onLogout }) {
      const titles = { dashboard: 'Dashboard', products: 'Products', vendors: 'Vendors', orders: 'Orders', inventory: 'Inventory', reports: 'Reports', settings: 'Settings' };
      return (
        <div className="layout" data-screen-label="02 Dashboard">
          <Sidebar active={active} onNavigate={onNavigate} />
          <main className="main">
            <Header title={titles[active] || 'Dashboard'} />
            <div className="content">
              <PageHeading title={`Welcome back, Priya.`} subtitle="Here's what's happening with your business today." />

              <div className="qa-section">
                <h3 className="section-title">Quick Stats</h3>
                <div className="stats-grid">
                  {QUICK_STATS.map((s, i) => <StatCard key={i} {...s} />)}
                </div>
              </div>

              <div className="qa-section">
                <h3 className="section-title">Quick Actions</h3>
                <QuickActionsLocal actions={[
                  { title: 'Add Product',  icon: '+', bg: 'var(--accent-600)',    onClick: () => onNavigate('products')  },
                  { title: 'New Order',    icon: '☰', bg: 'var(--primary-600)',   onClick: () => onNavigate('orders')    },
                  { title: 'View Reports', icon: '⌁', bg: 'var(--secondary-600)', onClick: () => onNavigate('reports')   },
                  { title: 'Manage Inventory', icon: '▢', bg: 'var(--info-600)',  onClick: () => onNavigate('inventory') },
                ]} />
              </div>

              <div className="two-col">
                <ActivityFeed items={ACTIVITY} />
                <div style={{ background: 'white', border: '1px solid var(--border-light)', borderRadius: 12, padding: 24, boxShadow: 'var(--shadow-sm)' }}>
                  <h3 style={{ fontSize: 18, fontWeight: 600, margin: '0 0 16px' }}>Order Fulfillment</h3>
                  <div style={{ fontSize: 48, fontWeight: 800, color: 'var(--primary-600)', lineHeight: 1 }}>94%</div>
                  <div style={{ fontSize: 13, color: 'var(--fg-secondary)', marginTop: 4 }}>On-time delivery rate</div>
                  <div style={{ marginTop: 16, height: 8, background: 'var(--gray-100)', borderRadius: 9999, overflow: 'hidden' }}>
                    <div style={{ width: '94%', height: '100%', background: 'var(--gradient-primary)' }} />
                  </div>
                  <button onClick={onLogout} style={{ marginTop: 24, width: '100%', minHeight: 40, background: 'white', border: '1px solid var(--border-medium)', borderRadius: 8, fontSize: 14, fontWeight: 500, cursor: 'pointer', color: 'var(--fg-primary)' }}>Sign out</button>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    function App() {
      const [authed, setAuthed] = useState(false);
      const [active, setActive] = useState('dashboard');
      if (!authed) return <div data-screen-label="01 Login"><Login onLogin={() => setAuthed(true)} /></div>;
      return <Dashboard active={active} onNavigate={setActive} onLogout={() => setAuthed(false)} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
