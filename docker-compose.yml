# docker-compose for local dev of the Nuray app containers.
# Postgres + Redis are expected to run on the host machine (the dev setup
# you already use); the containers reach them via `host.docker.internal`.
#
# Usage:
#   cp backend/.env.example backend/.env       # then fill in real values
#   docker compose up --build                  # builds + runs both services
#
# To rebuild from scratch:
#   docker compose down --volumes --remove-orphans
#   docker compose build --no-cache

# Container logs are rotated on the host (3 × 10 MB per service) instead of growing without bound.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nuray-backend
    restart: unless-stopped
    logging: *logging
    # Room for the graceful shutdown (drain, finish requests and jobs) before Docker kills it.
    stop_grace_period: 30s
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      # Override DATABASE_URL / REDIS_URL inside the container so they
      # point at the host's services rather than localhost-in-container.
      DATABASE_URL: ${DATABASE_URL:-postgresql://apple@host.docker.internal:5432/frozennuray_dev}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379}
      FRONTEND_URL: http://frontend:3000
      # Local storage driver: keep uploads on a named volume so a rebuild doesn't wipe
      # them. For production, prefer STORAGE_DRIVER=s3 (see backend/.env.example).
      UPLOADS_DIR: /app/uploads
      # Apply pending database migrations on start. For a database created before the
      # migration baseline, run `npm run db:baseline` once first (see backend/prisma/README.md).
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      # Linux compatibility — Docker Desktop on macOS already maps this.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SAFEPAY_SANDBOX: ${NEXT_PUBLIC_SAFEPAY_SANDBOX:-true}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${NEXT_PUBLIC_LEGAL_COMPANY_NAME:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_REVIEWED: ${NEXT_PUBLIC_LEGAL_REVIEWED:-false}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
        CSP_ENFORCE: ${CSP_ENFORCE:-false}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
    environment:
      # The API as the web server sees it (the build's NEXT_PUBLIC_API_URL is the browser's view), to read a dish or a kitchen
      # for its page title and link preview.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:3001/api/v1}
    container_name: nuray-frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
