<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nuray</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f6f6f7; color: #17171a;
      }
      @media (prefers-color-scheme: dark) { html, body { background: #0f0f11; color: #f6f6f8; } }
      .wrap { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; }
      .disc {
        width: 72px; height: 72px; border-radius: 9999px; background: #f23e02; color: #fff;
        display: grid; place-items: center; font-size: 34px; font-weight: 700; font-style: italic;
        margin: 0 auto 20px; box-shadow: 0 10px 30px -8px rgba(242,62,2,.5);
      }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
      p { margin: 4px 0; opacity: .7; font-size: 14px; max-width: 320px; }
      code { background: rgba(127,127,127,.18); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="disc">N</div>
        <h1>Nuray</h1>
        <p>Connecting to the kitchen…</p>
        <p style="margin-top:16px">
          Set <code>CAP_SERVER_URL</code> and run <code>npx cap sync</code> to load the live app.
        </p>
      </div>
    </div>
  </body>
</html>
