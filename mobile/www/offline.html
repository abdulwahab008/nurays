<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nuray</title>
  <script src="app-config.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAFAFA;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; text-align: center; }
    main { padding: 24px; max-width: 360px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #4b5563; margin: 0 0 4px; }
    p[lang="ur"] { direction: rtl; margin-top: 12px; }
    button { margin-top: 24px; background: #FF5500; color: #fff; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" width="72" height="72" alt="">
    <h1>Can't reach Nuray</h1>
    <p>Check your internet connection and try again.</p>
    <p lang="ur">نورے سے رابطہ نہیں ہو سکا۔ اپنا انٹرنیٹ کنکشن چیک کریں اور دوبارہ کوشش کریں۔</p>
    <!-- Loads the website again (the app opens it at start; this page is only shown when that failed). -->
    <button type="button" onclick="location.replace(window.NURAY_APP_URL || '/')">Try again</button>
  </main>
</body>
</html>
